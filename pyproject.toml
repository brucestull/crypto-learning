[project]
name = "crypto-demo"
version = "0.1.0"
description = "Teaching module: strong (Argon2id + AES-256-GCM) vs. deliberately-weak text encryption"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23",
]

# Expose the CLI as a console command, so `uv run crypto-demo ...` works
# (equivalent to `uv run python crypto_demo.py ...`).
[project.scripts]
crypto-demo = "crypto_demo:main"

# A console script means this project is now an installable package, so it
# needs a build backend. Hatchling is a good lightweight default.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The code is a single module (crypto_demo.py), not a package directory, so
# tell hatchling exactly which file to ship in the wheel.
[tool.hatch.build.targets.wheel]
only-include = ["crypto_demo.py"]
